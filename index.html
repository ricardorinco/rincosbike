<html>
<head runat="server">

    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <!-- Chrome, Firefox OS and Opera -->
	<meta name="theme-color" content="#000084">
	<!-- Windows Phone -->
	<meta name="msapplication-navbutton-color" content="#000084">
	<!-- iOS Safari -->
	<meta name="apple-mobile-web-app-status-bar-style" content="#000084">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Atividades encerradas em Jundiaí. Página dedicada à memória de Roque Rinco e ao seu legado no ciclismo, com respeito, história e honra eterna." />
    <meta name="keywords" content="roque rinco, rinco's bike, ciclismo jundiaí, memorial ciclismo, legado ciclismo jundiaí, homenagem ciclismo" />
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
    <!--[if lte IE 8]><link rel="stylesheet" href="css/ie/v8.css" /><![endif]-->
    <!--[if lte IE 9]><link rel="stylesheet" href="css/ie/v9.css" /><![endif]-->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Playfair+Display:wght@700&family=Montserrat:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
	<div class="hero">
		<div class="hero-inner">
			<h1>Rinco's Bike</h1>
            <p class="status"><strong>Atividades encerradas.</strong></p>

			<p>Uma história construída com trabalho, dedicação e amor pelo ciclismo em Jundiaí, deixando um legado de respeito</p>
			
            <div class="memorial">
                Em memória de Roque Rinco <span class="coracao">&#10084;</span>
                <br />
                <small>Seu legado seguirá vivo em cada pedalada.</small>
            </div>

            
		</div>
	</div>

	<script>
	// Fade ao rolar para hero e sections
    const heroInner = document.querySelector('.hero-inner');

    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if(entry.isIntersecting){
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.2 });

    if(heroInner) observer.observe(heroInner);
	</script>
</body>
</html>
